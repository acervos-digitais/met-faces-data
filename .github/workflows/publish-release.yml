name: Publish Release Assets

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        lfs: false

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install PIL
      run: |
        python -m pip install --upgrade pip
        pip install Pillow

    - name: Order eyes
      run: python scripts/sort_eyes.py

    - name: Tar Images
      run: |
        cd image/
        tar -czf eyes.tar.gz eyes
        tar -czf eyes-color.tar.gz eyes-color
        tar -czf eyes-color-aligned-01.tar.gz eyes-color-aligned-01
        tar -czf eyes-color-aligned-10.tar.gz eyes-color-aligned-10
        tar -czf eyes-color-aligned-15.tar.gz eyes-color-aligned-15
        tar -czf eyes-color-aligned-01-sorted.tar.gz eyes-color-aligned-01-sorted
        tar -czf eyes-color-aligned-10-sorted.tar.gz eyes-color-aligned-10-sorted
        tar -czf eyes-color-aligned-15-sorted.tar.gz eyes-color-aligned-15-sorted
        mv eyes*.tar.gz ../

    - name: Tag Release
      id: tag
      run: |
        TAG_NAME=${{ github.ref_name }}-$(git log --format=%h -1)
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
        git tag $TAG_NAME
        git push origin $TAG_NAME

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          eyes.tar.gz
          eyes-color.tar.gz
          eyes-color-aligned-01.tar.gz
          eyes-color-aligned-10.tar.gz
          eyes-color-aligned-15.tar.gz
          eyes-color-aligned-01-sorted.tar.gz
          eyes-color-aligned-10-sorted.tar.gz
          eyes-color-aligned-15-sorted.tar.gz
        tag_name: ${{ steps.tag.outputs.TAG_NAME }}
